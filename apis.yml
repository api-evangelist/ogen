apis:
  - aid: ogen:ogen
    name: Ogen
    description: >-
      The ogen code generator. Invoked as a build-time CLI against a local
      OpenAPI v3 document — `ogen [options] <spec>` — it writes a Go package
      containing a typed client, server, router, validators and JSON codecs.
      There is no hosted endpoint, no authentication and no base URL; the
      machine-readable contract is the published JSON Schema for the .ogen.yml
      configuration file.
