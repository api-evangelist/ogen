aid: ogen
name: Ogen
description: >-
  Ogen is an Apache-2.0 OpenAPI v3 code generator for Go, maintained by the
  ogen-go organization. It reads an OpenAPI v3 document at build time and emits
  a statically typed Go client and server: code-generated JSON encoding with no
  reflection or interface{}, code-generated validators, a static radix router,
  sum types for oneOf with name, type and value discrimination, Opt/Nil/OptNil
  wrappers instead of pointers, a typed SecuritySource interface, webhook client
  and server generation, Server-Sent Events client generation, and OpenTelemetry
  tracing and metrics. Behaviour is steered by a YAML config file with a
  published JSON Schema and by a twelve-term registry of x-ogen-* specification
  extensions. Ogen operates no hosted API of its own — it is distributed as a Go
  module, a pinned go.mod tool dependency, and a distroless container image.
