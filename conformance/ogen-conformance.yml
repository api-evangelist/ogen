  no Compliance pointer is wired.
standards:
  - id: openapi-3.0
    conforms: true
    level: full
    evidence: >-
      README and site describe ogen as "OpenAPI v3 Code Generator for Go";
      repository topics include openapi3; docs generate CI clients for the
      GitHub, Kubernetes, OpenAI, Telegram Bot and Firecracker specs.
    source: https://github.com/ogen-go/ogen
  - id: openapi-3.1
    conforms: true
    level: partial
    evidence: >-
      The spec object model in spec.go is documented against
      spec.openapis.org/oas/v3.1.0 and the version parser accepts 3.x. 3.1
      nullable-via-type-array support landed (issues #1617, #1708) with a known
      open gap for type arrays (#1619).
    source: https://github.com/ogen-go/ogen/blob/main/spec.go
  - id: openapi-specification-extensions
    conforms: true
    level: full
    evidence: >-
      Implements the x- patterned-field extension mechanism and publishes its
      own registry of x-ogen-* / x-oapi-codegen-extra-tags terms.
    source: https://ogen.dev/docs/spec/extensions
    artifact: vocabulary/ogen-extensions.yml
  - id: json-schema-draft-07
    conforms: true
    level: full
    evidence: >-
      The published ogen configuration schema declares
      $schema http://json-schema.org/draft-07/schema#.
    source: https://raw.githubusercontent.com/ogen-go/ogen/main/schemas/ogen.jsonschema.json
    artifact: json-schema/ogen-config.jsonschema.json
  - id: json-schema-2020-12
    conforms: true
    level: partial
    evidence: >-
      Sibling project ogen-go/schemacompiler compiles JSON Schema Draft 2020-12
      into an analyzed plan for Go code generation; ogen ships a jsonschema
