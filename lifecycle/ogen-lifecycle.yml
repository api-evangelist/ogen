notes: >-
  ogen is a build-time code generator distributed as a Go module and container
  image. It operates no hosted service, so there is no status page, no SLA, and
  no HTTP deprecation/Sunset surface to record. What it does have is a real
  release lifecycle: semantic versioning through the Go module proxy, a declared
  stability level, and a documented mechanism for pinning the generator version.
versioning:
