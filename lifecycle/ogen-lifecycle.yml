    Major version 1 means the module path carries no /vN suffix; a v2 would
    require a new import path per the Go module compatibility rules.
  pinning: >-
    Go 1.24+ `go get -tool github.com/ogen-go/ogen/cmd/ogen@latest` records the
    generator in the go.mod tool directive, pinning the version so generated
    code is reproducible across a team and in CI.
